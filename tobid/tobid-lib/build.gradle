apply plugin: 'com.android.library'

def v = rootProject.ext.version

android {
    compileSdkVersion v.comV

    defaultConfig {
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        multiDexEnabled true
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64', 'armeabi'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    flatDir {
        dirs '../libs', '../libs/AdNetworks/adgain'
    }
}

dependencies {
    implementation project(':tobid:adgain-adapter')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../libs')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../../adnetworklibs/baidu')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../../adnetworklibs/oaid')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.github.bumptech.glide:glide:4.5.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.5.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.android.support:multidex:1.0.3'

    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.googlecode.android-query:android-query:0.25.9'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.airbnb.android:lottie:6.0.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.14.9'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.2.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
}
