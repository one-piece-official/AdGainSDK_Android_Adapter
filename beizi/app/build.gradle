apply plugin: 'com.android.application'
def key = rootProject.ext.keystoreConfig
def v = rootProject.ext.version

android {
    compileSdkVersion v.comV
    defaultConfig {
        applicationId "com.beizi.androiddemo"
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        versionCode 1
        versionName "1.0"
        multiDexEnabled = true
    }
    signingConfigs {
        sign {
            keyAlias key.keyAlias
            keyPassword key.keyPassword
            storeFile key.storeFile
            storePassword key.storePassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.sign
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.sign
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.all {
        resolutionStrategy {
            force 'com.android.support:appcompat-v7:28.0.0'
            force 'com.android.support:support-v4:28.0.0'
            force 'com.android.support:design:28.0.0'
            force 'com.android.support:multidex:1.0.2'
            // 添加其他 support 库
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {

    implementation project(':beizi:amps-adapter')
//    implementation(name: 'adgain_taku_adapter_4.2.3', ext: 'aar')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    compileOnly 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:multidex:1.0.2'

    implementation 'androidx.appcompat:appcompat:1.5.1'

    implementation 'com.google.android.material:material:1.4.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation "com.android.support:appcompat-v7:v7:28.0.0"
    //noinspection GradleCompatible
    implementation "com.android.support:recyclerview-v7:v7:28.0.0"

    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
}
