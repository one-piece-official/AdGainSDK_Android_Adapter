apply plugin: 'com.android.library'

def v = rootProject.ext.version

android {
    namespace "com.amps.demo"
    compileSdkVersion v.comV

    defaultConfig {
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        multiDexEnabled = true
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

repositories {
    flatDir {
        dirs '../libs'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')
    api fileTree(include: ['*.jar', '*.aar'], dir: '../../adnetworklibs/gdt')
    api fileTree(include: ['*.jar', '*.aar'], dir: '../libs')

    api 'androidx.appcompat:appcompat:1.3.1'
    api 'androidx.recyclerview:recyclerview:1.2.1'
    api 'com.google.android.material:material:1.4.0'
    api 'androidx.constraintlayout:constraintlayout:2.1.4'
    api 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
}
