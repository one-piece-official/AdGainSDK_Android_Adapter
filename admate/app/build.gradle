apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
def key = rootProject.ext.keystoreConfig
def v = rootProject.ext.version

ext {
    // 目前更新 sdk 时需要手动修改版本号
    demoVersionCode = 30000
    demoVersionName = "3.0.0"
    baichuanVersion = '4.9.2.0'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.meishu.meishu_sdk_demo"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode getProject().ext.demoVersionCode
        versionName getProject().ext.demoVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
    }
    signingConfigs {
        debug {
            keyAlias key.keyAlias
            keyPassword key.keyPassword
            storeFile key.storeFile
            storePassword key.storePassword
        }

    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation project(':admate:adapter')
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')
//    implementation(name: 'ms-sdk_3.0.3.1_release', ext: 'aar')
    implementation(name: 'ms-sdk_2.5.12.3_release', ext: 'aar')

    implementation(name: 'GDTSDK.unionNormal.4.640.1510', ext: 'aar') // 广点通
    implementation(name: 'bugly-4.1.9.2', ext: 'aar')//bugly

    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.google.code.gson:gson:2.8.5'


    //noinspection GradleCompatible
    implementation 'androidx.appcompat:appcompat:1.0.0'
    //noinspection GradleCompatible
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    //noinspection GradleCompatible
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.0'

    implementation "com.github.bumptech.glide:glide:4.11.0"


    implementation 'com.google.android.gms:play-services-gcm:16.1.0'

    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.9'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'


    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    // 信通院 oaid-1.0.25 版本,也可以使用自己资源包
//    implementation 'com.domob.sdk:oaid:1.0.251'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.7.1'

    implementation 'com.google.android.material:material:1.11.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

}
