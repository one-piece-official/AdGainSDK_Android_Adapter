apply plugin: 'com.android.library'

def v = rootProject.ext.version

android {
    namespace "com.meishu.sdkdemo"
    compileSdkVersion v.comV

    defaultConfig {
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        multiDexEnabled true
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    repositories {
        flatDir {
            dirs 'libs',
                    '../../adnetworklibs/pangle'
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')
    api(name: 'ms-sdk_2.5.11.0_release', ext: 'aar')
    api(name: 'bugly-4.1.9.2', ext: 'aar')
    api(name: 'open_ad_sdk_7.3.0.7', ext: 'aar')
    api(name: 'adgain_admate_adapter_4.2.7', ext: 'aar')

    api "com.github.bumptech.glide:glide:4.11.0"
    api 'com.squareup.okhttp3:okhttp:3.12.1'
    api 'com.google.code.gson:gson:2.8.5'
    api 'com.squareup.picasso:picasso:2.71828'
    api 'androidx.appcompat:appcompat:1.0.0'
    api 'androidx.recyclerview:recyclerview:1.0.0'
    api 'androidx.constraintlayout:constraintlayout:1.1.3'
    api 'com.google.android.material:material:1.0.0'
    api 'androidx.multidex:multidex:2.0.0'
    api 'com.google.android.gms:play-services-gcm:16.1.0'
    api 'androidx.cardview:cardview:1.0.0'
    api 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.9'
    api 'com.google.android.flexbox:flexbox:3.0.0'
}
