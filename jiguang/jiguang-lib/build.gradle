apply plugin: 'com.android.library'

def v = rootProject.ext.version

android {
    namespace "com.jiguangssp.addemo"
    compileSdkVersion v.comV

    defaultConfig {
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        multiDexEnabled true
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    flatDir {
        dirs '../libs'
    }
}

dependencies {
    compileOnly fileTree(include: ['*.jar', '*.aar'], dir: '../libs')
    compileOnly fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')
    compileOnly fileTree(include: ['*.jar', '*.aar'], dir: '../../adnetworklibs/oaid')

    api 'androidx.appcompat:appcompat:1.2.0'
    api 'androidx.recyclerview:recyclerview:1.2.1'
    api 'androidx.constraintlayout:constraintlayout:2.0.4'
    api 'androidx.viewpager:viewpager:1.0.0'
    api 'androidx.multidex:multidex:2.0.1'
    api 'com.google.android.material:material:1.3.0'
    api 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    api 'com.makeramen:roundedimageview:2.3.0'

    api "cn.jiguang.sdk.ad:core:3.9.5.10153"
    api "cn.jiguang.sdk.ad:oaid:1.0.25.12122"
    api "cn.jiguang.sdk.ad.adapter:jgads:2.2.5.09061"
    api "cn.jiguang.sdk.ad.adapter:tianmu:2.2.5.09061"
}
