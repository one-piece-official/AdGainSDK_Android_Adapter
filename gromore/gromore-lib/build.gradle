apply plugin: 'com.android.library'

def v = rootProject.ext.version

android {
    namespace "com.union_test.toutiao"
    compileSdkVersion v.comV

    defaultConfig {
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        multiDexEnabled true
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'armeabi', 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    flatDir {
        dirs '../libs', '../libs/adn', '../libs/adn/mtg', '../libs/adn/sigmob', '../libs/adapter',
                '../../adnetworklibs/pangle'
    }
    maven { url 'https://artifact.bytedance.com/repository/AwemeOpenSDK' }
}

dependencies {
    api project(':gromore:adgain-adapter')
    api fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')

    compileOnly(name: "Baidu_MobAds_SDK-release_v9.371", ext: 'aar')
    api(name: "mediation_baidu_adapter_9.37.4", ext: 'aar')
    api(name: 'circleimageview-2.2.0', ext: 'aar')
    api(name: 'LayoutManagerGroup', ext: 'aar')
    api(name: 'tools-release', ext: 'aar')
    api(name: 'open_ad_sdk_7.3.0.7', ext: 'aar')

    api 'io.reactivex.rxjava2:rxandroid:2.0.1'
    api 'com.squareup.okhttp3:okhttp:3.12.1'
    api 'com.github.bumptech.glide:glide:4.5.0'
    api "com.android.support:appcompat-v7:28.0.0"
    api "com.android.support:support-annotations:28.0.0"
    api "com.android.support:support-v4:28.0.0"
    api "com.squareup.leakcanary:leakcanary-android-no-op:1.5.4"
    api "com.android.support:recyclerview-v7:28.0.0"
    api 'com.android.support:multidex:1.0.3'
    api 'com.android.support.constraint:constraint-layout:2.0.4'
    api "com.google.code.gson:gson:2.8.5"
    api "com.bytedance.ies.ugc.aweme:opensdk-china-external:0.1.8.0"
    api "com.bytedance.ies.ugc.aweme:opensdk-common:0.1.8.0"
}
