apply plugin: 'com.android.library'

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(include: ['*.jar', '*.aar'], dir: '../libs')
    compileOnly fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')

    api 'androidx.multidex:multidex:2.0.1'
    api "androidx.appcompat:appcompat:1.6.1"
    api 'androidx.recyclerview:recyclerview:1.3.1'
    api 'androidx.constraintlayout:constraintlayout:2.1.4'
    api 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    api 'com.github.bumptech.glide:glide:4.9.0'
    api 'com.google.code.gson:gson:2.8.9'
    api 'com.squareup.okhttp3:okhttp:3.12.1'
    api 'com.googlecode.android-query:android-query:0.25.9'
    api 'androidx.cardview:cardview:1.0.0'
    api(group: 'com.tanx', name: 'TanxUISDK', version: '3.1.1')
}
