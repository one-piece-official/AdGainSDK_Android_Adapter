apply plugin: 'com.android.application'
android {
    compileSdkVersion 33
    defaultConfig {
//        applicationId "com.medpro.and"
                applicationId "com.jd.sdkceshiandroid"//京东测试包名

        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        flavorDimensions "default"
    }

    signingConfigs {

        release {
            storeFile file('keystore')
            storePassword "demo123"
            keyAlias 'demo'
            keyPassword "demo123"
        }
    }


    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "demo.apk"
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation project(':mediatom:mediatom-lib')
    implementation project(':mediatom:adgain-adapter')

//    implementation project(':gromore:adgain-adapter')

    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')

    // 广告
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '../libs')

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.9.0'
    //如果引入米盟需要，如果没有引用gson就使用米盟广告会导致崩溃
    implementation 'com.google.code.gson:gson:2.8.9'
    //如果引入TANX需要
    implementation (group: 'com.tanx', name: 'TanxUISDK', version: '3.1.1')
    //如果引入汇盈sdk必须引入内容
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.googlecode.android-query:android-query:0.25.9'
    implementation "com.android.support:cardview-v7:27.1.1"
}
