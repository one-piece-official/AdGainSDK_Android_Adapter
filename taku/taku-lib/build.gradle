apply plugin: 'com.android.library'

def v = rootProject.ext.version

android {
    namespace "com.anythink.sdk.demo"
    compileSdkVersion v.comV

    defaultConfig {
        minSdkVersion v.minV
        targetSdkVersion v.targetV
        multiDexEnabled = true
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.all {
        resolutionStrategy {
            force 'com.android.support:appcompat-v7:28.0.0'
            force 'com.android.support:support-v4:28.0.0'
            force 'com.android.support:design:28.0.0'
            force 'com.android.support:multidex:1.0.2'
        }
    }
}

repositories {
    flatDir {
        dirs '../libs', '../../gromore/libs'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    api project(':taku:adgain-adapter')

    api fileTree(include: ['*.jar', '*.aar'], dir: '../../adgainlibs')

    api(name: 'anythink_core', ext: 'aar')
    api(name: 'anythink_native', ext: 'aar')
    api(name: 'anythink_interstitial', ext: 'aar')
    api(name: 'anythink_rewardvideo', ext: 'aar')
    api(name: 'anythink_splash', ext: 'aar')
    api(name: 'anythink_banner', ext: 'aar')
    api(name: 'anythink_china_core', ext: 'aar')

    api(name: 'anythink_adx_sdk_kuying_6.5.37_necessary', ext: 'aar')
    api(name: 'anythink_network_adx_kuying_sdk_necessary', ext: 'aar')

    compileOnly 'com.android.support:appcompat-v7:28.0.0'
    api 'com.android.support:design:28.0.0'
    api 'com.android.support:multidex:1.0.2'
    api(name: 'LayoutManagerGroup', ext: 'aar')
}
